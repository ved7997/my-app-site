<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой аналог AppSheet</title>
    <!-- Красивые стили Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        .card-app { transition: all 0.2s ease-in-out; border-left: 5px solid #0d6efd; border-radius: 8px; }
        .card-app:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .comment-text { white-space: pre-wrap; word-break: break-word; color: #495057; }
    </style>
</head>
<body>

<div class="container my-5" style="max-width: 900px;">
    
    <!-- ЗАГОЛОВОК -->
    <div class="row mb-5 align-items-center">
        <div class="col-md-7">
            <h1 class="fw-bold text-dark m-0">Панель управления</h1>
            <p class="text-muted m-0">База данных Google Sheets + GitHub Pages</p>
        </div>
        <div class="col-md-5 mt-3 mt-md-0">
            <input type="text" id="searchInput" class="form-control form-control-lg border-0 shadow-sm" placeholder="🔍 Быстрый поиск...">
        </div>
    </div>

    <!-- ФОРМА ВВОДА ДАННЫХ -->
    <div class="card p-4 mb-5 border-0 shadow-sm bg-white rounded-4">
        <h4 class="fw-bold text-primary mb-3">Добавить новую запись</h4>
        <form id="dataForm">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-semibold text-secondary">Название записи</label>
                    <input type="text" id="formTitle" class="form-control form-control-lg border-light bg-light" placeholder="Введите название..." required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold text-secondary">Комментарий (любая длина)</label>
                    <textarea id="formComment" class="form-control border-light bg-light" rows="4" placeholder="Напишите развернутый комментарий со всеми деталями..." required></textarea>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg px-5 rounded-3">Сохранить в базу</button>
                </div>
            </div>
        </form>
    </div>

    <!-- СПИСОК КАРТОЧЕК -->
    <h4 class="fw-bold text-dark mb-3">Существующие записи</h4>
    
    <!-- Загрузчик -->
    <div id="loader" class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Синхронизация с таблицей...</p>
    </div>

    <!-- Контейнер для вывода карточек -->
    <div class="row g-3" id="appContainer"></div>
</div>

<script>
    // ==========================================
    // ⚠️ НАСТРОЙКА ССЫЛОК ПОД СЕБЯ:
    // ==========================================
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_3-65HKRGdQMCwDyBbPu6Ov0c6HkX75HUroXqTUbkYXrdhpAxCSZPcQhGM2qZhNR2SFu0_NWZ2mGR/pub?output=csv";
    const scriptUrl = "https://script.google.com/macros/s/AKfycbw5L-JdcuEQBhNJzViL7Ck5iW9nm9f_YFTut-TCyR_1mK9HT4oO-eeDJ9sU_2DtzXN6VA/exec";

    let globalData = [];

    // Умный разбор CSV, сохраняющий длинный текст с переносами строк и запятыми
    function parseCSV(text) {
        let lines = [];
        let row = [""];
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            let r = text[i];
            let next = text[i+1];

            if (r === '"') {
                if (inQuotes && next === '"') { 
                    row[row.length - 1] += '"'; i++; 
                } else { 
                    inQuotes = !inQuotes; 
                }
            } else if (r === ',' && !inQuotes) {
                row.push('');
            } else if ((r === '\r' || r === '\n') && !inQuotes) {
                if (r === '\r' && next === '\n') { i++; }
                lines.push(row);
                row = [""];
            } else {
                row[row.length - 1] += r;
            }
        }
        if (row.length > 1 || row[0] !== "") {
            lines.push(row);
        }
        return lines.filter(r => r.length > 0);
    }

    // Чтение данных из Google Sheets
    async function loadData() {
        try {
            // Добавляем к ссылке случайный параметр, чтобы браузер не кэшировал старую таблицу
            const response = await fetch(csvUrl + "&nocache=" + new Date().getTime());
            const text = await response.text();
            
            const rawRows = parseCSV(text);
            if (rawRows.length < 2) {
                document.getElementById('appContainer').innerHTML = `<div class="col-12 text-center text-muted">Таблица пока пуста</div>`;
                document.getElementById('loader').classList.add('d-none');
                return;
            }

            const headers = rawRows[0];
            
            globalData = rawRows.slice(1).map(row => {
                let item = {};
                headers.forEach((header, index) => {
                    item[header.trim()] = row[index] ? row[index].trim() : "";
                });
                return item;
            }).filter(item => {
                // Фильтруем пустые строки: у записи должен быть ID или Название
                return (item['ID'] && item['ID'] !== "") || (item['Название'] && item['Название'] !== "");
            });

            document.getElementById('loader').classList.add('d-none');
            renderCards(globalData);

        } catch (error) {
            console.error("Ошибка чтения данных:", error);
            document.getElementById('loader').innerHTML = `<p class="text-danger">Ошибка синхронизации данных. Проверьте публикацию .csv</p>`;
        }
    }

    // Отрисовка карточек
    function renderCards(data) {
        const container = document.getElementById('appContainer');
        container.innerHTML = "";

        if (data.length === 0) {
            container.innerHTML = `<div class="col-12 text-center text-muted my-4">Ничего не найдено</div>`;
            return;
        }

        // Выводим карточки (новые будут вверху списка за счет .reverse())
        [...data].reverse().forEach(item => {
            const card = document.createElement('div');
            card.className = 'col-12';
            card.innerHTML = `
                <div class="card card-app bg-white border-0 shadow-sm p-3 mb-2">
                    <div class="card-body p-2">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="fw-bold text-dark m-0">${item['Название'] || 'Без названия'}</h5>
                            <span class="badge bg-light text-primary border border-primary-subtle px-2 py-1">ID: ${item['ID'] || '?—'}</span>
                        </div>
                        <div class="comment-text mt-2">${item['Комментарий'] || '<span class="text-muted">Комментарий отсутствует</span>'}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Отправка новой формы (Добавление данных)
    document.getElementById('dataForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Сохранение...";

        const payload = {
            title: document.getElementById('formTitle').value,
            comment: document.getElementById('formComment').value
        };

                try {
            // Отправляем данные как простой текст, чтобы гарантированно обойти ограничения CORS
            const response = await fetch(scriptUrl, {
                method: "POST",
                mode: "no-cors", // Меняем на "no-cors", браузер пропустит запрос вслепую
                headers: {
                    "Content-Type": "text/plain" 
                },
                body: JSON.stringify(payload)
            });
            
            // В режиме no-cors мы не можем прочитать ответ от сервера (он будет пустой status: 0),
            // но если запрос не выкинул ошибку в catch — значит данные успешно улетели в Google
            
            document.getElementById('dataForm').reset();
            document.getElementById('appContainer').innerHTML = "";
            document.getElementById('loader').classList.remove('d-none');
            
            // Даем таблице 3 секунды обновиться и перезагружаем карточки
            setTimeout(loadData, 3000); 

        } catch (error) {
            console.error("Ошибка сети:", error);
            alert("Не удалось отправить данные.");
            submitBtn.disabled = false;
            submitBtn.innerText = "Сохранить в базу";
        }

    });

    // Живой поиск
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = globalData.filter(item => {
            return Object.values(item).some(val => val.toLowerCase().includes(query));
        });
        renderCards(filtered);
    });

    // Стартовая инициализация
    window.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>


</body>
</html>
